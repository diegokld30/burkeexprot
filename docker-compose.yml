# PRODUCCIÓN — las contraseñas se leen del archivo .env (no versionado)
# ⚠️ No cambies el nombre del servicio "db" ni del volumen "db_data": ahí están los datos.
services:
  db:
    image: mariadb:11.4   # LTS con parches de seguridad hasta 2029
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: ${DATABASE_NAME:?Define DATABASE_NAME en .env}
      MARIADB_USER: ${DATABASE_USER:?Define DATABASE_USER en .env}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD en .env}
      MARIADB_AUTO_UPGRADE: "1"   # actualiza las tablas del sistema al cambiar de versión
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true

  web:
    build: .
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${WEB_PORT:-8001}:8000"  # solo accesible desde nginx en este servidor (WEB_PORT en .env)
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
