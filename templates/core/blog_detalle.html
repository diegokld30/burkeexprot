{% extends 'core/base.html' %}
{% load i18n %}

{% block content %}
<article>
  <header class="container-x max-w-4xl pb-12 pt-16 md:pt-24">
    <nav aria-label="{% trans 'Ruta de navegación' %}" class="text-xs font-semibold uppercase tracking-[0.18em] text-ink/50">
      <ol class="flex flex-wrap items-center gap-2">
        <li><a href="{% url 'index' %}" class="hover:text-brand">{% trans "Inicio" %}</a></li>
        <li aria-hidden="true">/</li>
        <li><a href="{% url 'blog_lista' %}" class="hover:text-brand">{% trans "Blog" %}</a></li>
      </ol>
    </nav>
    <h1 class="mt-8 font-serif text-4xl leading-[1.1] md:text-6xl">{{ post.titulo }}</h1>
    <time datetime="{{ post.fecha|date:'Y-m-d' }}" class="mt-6 block text-sm text-ink/55">{{ post.fecha|date:"DATE_FORMAT" }}</time>
  </header>

  <div class="container-x max-w-6xl">
    <img src="{{ post.imagen.url }}" alt="{{ post.titulo }}" fetchpriority="high" decoding="async"
         class="aspect-[16/9] w-full rounded-[1.75rem] object-cover">
  </div>

  <div class="container-x max-w-3xl py-16 md:py-20">
    <div class="prose prose-lg max-w-none prose-p:leading-relaxed prose-p:text-ink/80 prose-headings:font-serif">
      {{ post.contenido|linebreaks }}
    </div>
    <div class="mt-16 border-t border-line pt-8">
      <a href="{% url 'blog_lista' %}" class="link-arrow text-ink hover:text-brand">
        <svg class="size-4 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6"/></svg>
        {% trans "Volver al blog" %}
      </a>
    </div>
  </div>
</article>

{% include "core/partials/cta.html" %}
{% endblock %}
