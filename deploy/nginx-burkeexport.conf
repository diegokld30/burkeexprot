# nginx para burkeexport.com — REFERENCIA. No reemplaces a ciegas tu archivo actual:
# conserva las líneas ssl_* que gestiona certbot y ajusta el puerto a tu WEB_PORT.
# Prueba siempre con: sudo nginx -t && sudo systemctl reload nginx
# Las zonas usan el prefijo "burke_" para no chocar con otros sitios del servidor.

# ── Límites contra bots (contexto http) ──
limit_req_zone  $binary_remote_addr zone=burke_general:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=burke_login:10m   rate=5r/m;
limit_conn_zone $binary_remote_addr zone=burke_conn:10m;

server {
    listen 80;
    server_name burkeexport.com www.burkeexport.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name burkeexport.com www.burkeexport.com;

    # Certificados (certbot los gestiona; conserva los que ya tengas)
    ssl_certificate     /etc/letsencrypt/live/burkeexport.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/burkeexport.com/privkey.pem;

    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    limit_req  zone=burke_general burst=40 nodelay;
    limit_conn burke_conn 30;
    limit_req_status 429;

    # Rutas que solo buscan los escáneres automáticos → se cierra la conexión
    location ~* (^/\.|wp-admin|wp-login|wp-content|xmlrpc\.php|phpmyadmin|\.php$|\.env|\.git|\.sql$|cgi-bin) {
        return 444;
    }

    # Login del panel: máximo 5 intentos/minuto por IP (además de django-axes).
    # Ajusta "gestion-[a-z0-9]+" si cambias ADMIN_URL.
    location ~ ^/gestion-[a-z0-9]+/login/ {
        limit_req zone=burke_login burst=5 nodelay;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8001;   # ← tu WEB_PORT
    }

    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8001;   # ← tu WEB_PORT
    }

    # Opcional (más rápido): que nginx sirva las fotos subidas. Si lo activas,
    # pon SERVE_MEDIA=False en .env. Ajusta la ruta del proyecto.
    # location /media/ {
    #     alias /ruta/al/proyecto/media/;
    #     expires 30d;
    #     add_header X-Content-Type-Options nosniff;
    # }
}
