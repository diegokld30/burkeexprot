{% load static %}
{# Cabecera de páginas internas. Parámetros: eyebrow, title, subtitle, image (ruta static, opcional) #}
<section class="relative isolate overflow-hidden bg-ink text-white">
  {% if image %}
    <img src="{% static image %}" alt="" width="1600" height="900" fetchpriority="high"
         class="absolute inset-0 -z-20 h-full w-full object-cover opacity-45">
  {% endif %}
  <div class="absolute inset-0 -z-10 bg-gradient-to-r from-ink via-ink/85 to-ink/40"></div>
  <div class="container-x py-24 md:py-32">
    <p class="eyebrow text-wood-300">{{ eyebrow }}</p>
    <h1 class="mt-6 max-w-3xl font-serif text-4xl leading-[1.1] sm:text-5xl lg:text-6xl">{{ title }}</h1>
    {% if subtitle %}<p class="mt-6 max-w-2xl text-lg leading-relaxed text-white/70">{{ subtitle }}</p>{% endif %}
  </div>
</section>
